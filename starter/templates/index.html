<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="page-header">
    <h1>Sudoku Game</h1>
    <button id="theme-toggle" type="button" aria-pressed="false">
      Switch to dark mode
    </button>
  </header>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty" name="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint">Hint</button>
    <span>Hints used: <span id="hints-used">0</span></span>
    <span>Time: <span id="timer">00:00</span></span>
    <span id="message"></span>
  </div>
  <section class="leaderboard" aria-labelledby="leaderboard-heading">
    <h2 id="leaderboard-heading">Top 10 Fastest Times</h2>
    <p id="leaderboard-empty">No completed games yet. Be the first!</p>
    <ol id="leaderboard-list"></ol>
  </section>
  <dialog id="score-dialog" aria-labelledby="score-dialog-heading">
    <form id="score-form">
      <h2 id="score-dialog-heading">Add your time to the leaderboard</h2>
      <label for="player-name">Your name</label>
      <input id="player-name" name="player-name" type="text" maxlength="40"
             autocomplete="name" required>
      <p id="player-name-error" role="alert"></p>
      <button type="submit">Save time</button>
    </form>
  </dialog>
  <script src="/static/main.js"></script>
</body>
</html>
